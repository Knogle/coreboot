# X58-ACPI-RAMLAB-01: network-loaded GRUB, not replacement firmware.
# Only console setup and observations run automatically.  No menu entry,
# chainloader, boot, exit, reset, acpi override or register write is scheduled.
serial --port=0x3f8 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial
set pager=0

echo X58-ACPI-RAMLAB-01
echo "B06WJ baseline; no automatic boot or ACPI replacement"
echo "UART COM1 0x3f8 115200 8N1; serial input/output only"
echo "ACPI inventory follows; these are current RAM tables"
lsacpi
echo "Firmware memory map follows; no memory test"
lsmmap
echo "BIOS disks/partitions follow; observation only"
ls -l
echo "Unmodified release DSDT: (memdisk)/boot/grub/dsdt-wj.aml"
echo "READY: interactive GRUB CLI; no automatic continuation"
# With no menu entries, normal mode presents its command line.  Deliberately
# do not source a disk's grub.cfg or call normal/boot/exit from this file.
